services:
  postgres:
    image: postgres:16
    container_name: fleetflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetflow
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fleetflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow -d fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fleetflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  fleetflow_pgdata:
